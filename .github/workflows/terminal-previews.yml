name: Terminal UI previews

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tui.py'
      - 'tui_core.py'
      - 'sku_check_core.py'
      - 'sku_check_runner.py'
      - 'offer_discovery.py'
      - 'tests/test_offer_discovery.py'
      - 'assets/frida/sku_query_readonly.js'
      - 'tests/test_sku_check.py'
      - 'device_diagnostics.py'
      - 'requirements-tui.txt'
      - 'tests/test_tui*.py'
      - 'scripts/ci/**'
      - '.github/workflows/terminal-previews.yml'

permissions:
  contents: read

concurrency:
  group: terminal-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install preview dependencies
        run: |
          python -m pip install -r requirements-tui.txt 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/terminal-xterm" --no-save --ignore-scripts '@xterm/xterm@5.5.0'
      - name: Verify TUI behavior and compact layout
        run: |
          python -m unittest discover -s tests -p 'test_tui.py' -v
          python -m unittest discover -s tests -p 'test_sku_check.py' -v
          python -m unittest discover -s tests -p 'test_offer_discovery.py' -v
      - name: Capture running terminal (synthetic states only)
        env:
          XTERM_DIST: ${{ runner.temp }}/terminal-xterm/node_modules/@xterm/xterm
          PREVIEW_OUTPUT: terminal-previews
        run: python scripts/ci/capture_terminal.py
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-previews-${{ github.event.pull_request.head.sha }}
          path: terminal-previews/*.png
          if-no-files-found: error
          retention-days: 14

  publish:
    # A fork's untrusted code never receives write permissions or publishes images.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: terminal-previews-${{ github.event.pull_request.head.sha }}
          path: images
      - name: Publish verified PNGs and update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, struct, subprocess
          from pathlib import Path

          repo = os.environ['GH_REPO']
          number = int(os.environ['PR_NUMBER'])
          head = os.environ['PR_HEAD']
          base = os.environ['BASE_SHA']
          expected = [
              '01-startup.png', '02-disconnected.png', '03-offer-found.png',
              '04-step-picker-compact.png', '05-approval-compact.png', '06-play-review.png',
              '07-linux-startup.png', '08-linux-step-picker.png',
              '09-step1-sku-offers.png', '10-step1-sku-missing.png',
              '11-step1-discovered-offers.png',
              '12-step0-ready.png',
              '13-step0-adb-missing.png',
              '14-account-picker.png',
              '15-step1-error.png',
              '16-step1-running.png',
              '17-step3-approval.png',
              '18-step4-approval.png',
              '19-step5-approval.png',
              '20-step3-review.png',
              '21-step4-review.png',
              '22-step5-review.png',
              '23-step3-retry.png',
              '24-step1-unverified.png',
              '25-step2-approval-wide.png',
              '26-step5-picker.png',
          ]
          labels = ['Start', 'Disconnected', 'Offers found', 'Choose a step (90×20)',
                    'Step 2 confirmation (90×20)', 'Review in Google Play',
                    'Linux dashboard (110×35)', 'Linux step picker (110×35)',
                    'Step 1 — supported offer list (synthetic)', 'Step 1 — no supported offers (synthetic)',
                    'Step 1 — optional Step 5 (synthetic)',
                    'Step 0 — environment ready',
                    'Step 0 — ADB missing popup',
                    'Choose account popup',
                    'Step 1 — error popup',
                    'Step 1 — checking progress',
                    'Step 3 — confirmation popup',
                    'Step 4 — confirmation popup',
                    'Step 5 — optional confirmation popup',
                    'Step 3 — review in Google Play',
                    'Step 4 — review in Google Play',
                    'Step 5 — review in Google Play',
                    'Step 3 — retry safety popup',
                    'Step 1 — unverified account popup',
                    'Step 2 — confirmation popup (wide)',
                    'Step 5 — optional step selection',
                    ]
          paths = sorted(p.name for p in Path('images').iterdir())
          if paths != expected:
              raise SystemExit('Unexpected preview artifact contents')

          def api(path, method='GET', data=None, allow_missing=False):
              cmd = ['gh', 'api', '--method', method, path]
              result = subprocess.run(cmd + (['--input', '-'] if data is not None else []),
                                      input=json.dumps(data) if data is not None else None,
                                      text=True, capture_output=True)
              if result.returncode:
                  if allow_missing and 'HTTP 404' in result.stderr:
                      return None
                  raise RuntimeError(f'GitHub API {method} {path} failed: {result.stderr[:500]}')
              return json.loads(result.stdout) if result.stdout.strip() else None

          root = f'/repos/{repo}'
          if api(f'{root}/pulls/{number}')['head']['sha'] != head:
              raise SystemExit('PR has a newer commit; skipping stale screenshots')
          elements = []
          for name in expected:
              data = (Path('images') / name).read_bytes()
              if len(data) > 8_000_000 or len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit(f'Invalid PNG: {name}')
              width, height = struct.unpack('>II', data[16:24])
              if not (1 <= width <= 4096 and 1 <= height <= 4096):
                  raise SystemExit(f'Invalid PNG dimensions: {name}')
              blob = api(f'{root}/git/blobs', 'POST', {
                  'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'})
              elements.append({'path': f'images/{name}', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          branch = f'ui-snapshots/pr-{number}'
          current = api(f'{root}/git/ref/heads/{branch}', allow_missing=True)
          parent = current['object']['sha'] if current else base
          tree = api(f'{root}/git/trees', 'POST', {'tree': elements})
          commit = api(f'{root}/git/commits', 'POST', {
              'message': f'Update terminal previews for PR #{number} ({head[:12]})',
              'tree': tree['sha'], 'parents': [parent]})['sha']
          if api(f'{root}/pulls/{number}')['head']['sha'] != head:
              raise SystemExit('PR has a newer commit; skipping stale screenshots')
          if current:
              api(f'{root}/git/refs/heads/{branch}', 'PATCH', {'sha': commit, 'force': False})
          else:
              api(f'{root}/git/refs', 'POST', {'ref': f'refs/heads/{branch}', 'sha': commit})
          marker = '<!-- terminal-ui-previews -->'
          lines = [marker, '## Terminal UI previews',
                   f'Actual Textual UI rendered in a PTY with xterm.js on Linux. PR commit: `{head[:12]}`.',
                   '**All accounts, offers and checkout results below are simulated. No emulator or payment was used.**', '']
          for label, name in zip(labels, expected):
              url = f'https://raw.githubusercontent.com/{repo}/{commit}/images/{name}'
              lines.extend([f'### {label}', f'![{label}]({url})', ''])
          body = '\n'.join(lines)
          existing = None
          page = 1
          while True:
              comments = api(f'{root}/issues/{number}/comments?per_page=100&page={page}')
              existing = next((c for c in comments if marker in c.get('body', '') and
                               c.get('user', {}).get('login') == 'github-actions[bot]'), None)
              if existing or len(comments) < 100:
                  break
              page += 1
          if existing:
              api(f"{root}/issues/comments/{existing['id']}", 'PATCH', {'body': body})
          else:
              api(f'{root}/issues/{number}/comments', 'POST', {'body': body})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(body + '\n')
          print(f'Published {len(expected)} preview images for {head[:12]}.')
          PY
