name: "Contribution"
description: "Propose a contribution, share completed work, or request contributor credit."
title: "[Contribution] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ePlus AI Toolkit!
        Use this form for contributions and attribution requests. For ordinary bugs or feature requests, use the relevant issue form when available.
        Do not include credentials, account emails, payment details, billing tokens, device identifiers or unredacted logs. Never perform real checkout to demonstrate a contribution.
  - type: dropdown
    id: contribution_type
    attributes:
      label: "Contribution type"
      options:
        - "Code or bug fix"
        - "Platform support"
        - "Documentation or translation"
        - "Testing or reproducible feedback"
        - "Contributor credit or correction"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: contribution_status
    attributes:
      label: "Status"
      options:
        - "Proposal"
        - "Work in progress"
        - "Completed or submitted"
        - "Existing credit correction"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Contribution details"
      description: "Describe your work, its benefits, or the exact attribution correction."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "References"
      description: "Public PR, commit, issue, documentation or sanitized test evidence. For credit requests, identify the work and its original author(s). For proposals, explain the intended work."
    validations:
      required: true
  - type: input
    id: preferred_credit
    attributes:
      label: "Preferred attribution (optional)"
      description: "Your preferred public name or GitHub handle. Do not share private contact details."
      placeholder: "@github-handle"
  - type: checkboxes
    id: confirmation
    attributes:
      label: "Confirmation"
      options:
        - label: "I have removed sensitive data and will preserve original authorship and applicable license notices."
          required: true
  - type: markdown
    attributes:
      value: |
        Credit requests are reviewed before updating CONTRIBUTORS.md. An issue alone does not establish authorship, approval or GitHub commit-contributor status.
